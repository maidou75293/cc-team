# cc-team 引擎发布包元数据（REQ-OSS-ENGINE-1）。
# 纯标准库、零运行时依赖；requires-python 与引擎基线一致（f-string/walrus 之外不用新语法）。
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-team-engine"
version = "0.1.0"
description = "文件台账式多智能体协同引擎：卡账本 + 泳道派工 + 心跳回收，外接任意终端 agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cc-team engine contributors" }]
keywords = ["agent", "orchestration", "ledger", "worktree", "queue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
cc = "ccards.oss_cli:main"

[tool.setuptools]
packages = ["ccards"]
