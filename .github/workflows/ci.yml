# 五套红绿锁 + 发布锁的双平台实跑（ubuntu + windows=本引擎实际宿主形态）。
# 判据面本地是什么，CI 就是什么：不许在此加“特殊豁免”。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # 手动按钮（Actions 页 Run workflow）+ 每日定时：macOS 实验通道与观察用的触发口。
  # 注=GitHub 云侧排程，不是本机 OS 定时器（零 OS 铁律管的是常驻引擎，不受此影响）。
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"   # 每日 01:30 UTC（北京 09:30）一圈全量含 macOS

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # windows runner 默认 charmap 码页：中文测试输出 print 即 UnicodeEncodeError（首绿实锤 08:59）
      PYTHONIOENCODING: utf-8
      # 测试沙箱会真起 git 仓提交；runner 默认无身份→GIT_* 环境变量全局兜底（作者+提交者四件套）
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@ci.local
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@ci.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # 渲染层 DOM 桩（#68/panel）要 node；board 锁在无 board 时自动 SKIP
      - name: five mechanism suites
        shell: bash
        run: bash tests/all.sh        # 末行须见 ALL_SUITES_PASS（脚本非零即红）
      - name: release lock (A/B/C)
        shell: bash
        # 独立发行仓形态下 C 自动 SKIP（见 oss-release-check.py 注释），A/B 照强制
        run: python -I tests/oss-release-check.py

  # 业主令 11-04「我们可能要在 macOS 上测试」：首发=实验通道（continue-on-error，
  # 红不挡 ubuntu/windows 正判、不占首绿定义）；连续多圈稳定后再转正进矩阵。
  suites-macos:
    name: suites (macos-latest · 实验)
    # 额度纪律（业主 11-04 18:2x「有这个免费额度挺好」后定口径）：macOS 1 分钟=10 倍扣
    # 2000 分/月池 ⇒ 只在「每日定时圈 + 手动按钮」跑，不随 push/PR 烧额度。
    # 连续多圈稳定后再转正进主矩阵（届时撤本 if 与 continue-on-error）。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@ci.local
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@ci.local
    steps:
      - uses: actions/checkout@v4
      - name: 宿主留证（macOS 版本/架构/bash——bash3.2 类差异归因要看这行）
        shell: bash
        run: sw_vers; uname -m; echo "BASH=$BASH_VERSION"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: five mechanism suites
        shell: bash
        run: bash tests/all.sh
      - name: release lock (A/B/C)
        shell: bash
        run: python -I tests/oss-release-check.py
